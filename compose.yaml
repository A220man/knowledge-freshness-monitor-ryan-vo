services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: development
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: sqlite:////app/data/knowledge_freshness.db
      AUTH_METHOD: demo
      OIDC_ISSUER_URL: http://127.0.0.1:8080/realms/knowledge-freshness
      OIDC_CLIENT_ID: knowledge-freshness-app
      OIDC_CLIENT_SECRET: ""
      OIDC_REDIRECT_URI: http://127.0.0.1:8000/api/auth/callback
      SESSION_COOKIE_NAME: kfm_session
      COOKIE_SECURE: "false"
      LLM_PROVIDER: openai-compatible
      LLM_MODEL: qwen3.8-27b
      LLM_BASE_URL: https://llm.chris-vo.com/v1
      LLM_API_KEY: ""
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  keycloak_data:
  backend_data:
